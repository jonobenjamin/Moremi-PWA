  <style>
    /*
      Flutter Web default: engine appends <flutter-view> to document.body (no hostElement).
      Fill the viewport; do NOT wrap in a custom host — that often yields a collapsed height.
    */
    html {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
      background-color: #1a1a1a;
      -webkit-text-size-adjust: 100%;
    }

    /* Injected by the engine as a direct child of body */
    flutter-view {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      z-index: 0;
      display: block;
    }

    flt-glass-pane {

      height: 100%;

    }
  </style>

  <script>
    (function () {
      try {
        if (typeof URLSearchParams === 'undefined') return;
        var p = new URLSearchParams(window.location.search);
        if (p.get('moremi_dev_sw_reset') === '1' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
      } catch (e) {}
    })();
  </script>

  <script>
    function moremiLsPrefix() {
      try {
        var path = window.location.pathname || '/';
        var seg = path.replace(/^\/+|\/+$/g, '').split('/').filter(function (x) { return x; })[0] || 'app';
        return 'moremi:' + seg + ':';
      } catch (e) {
        return 'moremi:app:';
      }
    }
    function moremiSignOut() {
      if (window.authService && typeof window.authService.signOut === 'function') {
        return window.authService.signOut().then(function () {
          window.location.reload();
        }).catch(function () {
          window.location.reload();
        });
      }
      try {
        var p = moremiLsPrefix();
        ['firebaseIdToken', 'firebaseUid', 'userAuthenticated', 'authenticatedUserName', 'authenticatedUsername'].forEach(function (k) {
          localStorage.removeItem(p + k);
        });
      } catch (e) {}
      window.location.reload();
    }
  </script>
