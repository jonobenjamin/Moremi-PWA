<!DOCTYPE html>
<html>
<head>
  <base href="/Moremi-PWA/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Moremi wildlife sightings">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moremi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <title>Moremi wildlife</title>
  <link rel="manifest" href="manifest.json">

  <script>
    function moremiSignOut() {
      if (window.authService && typeof window.authService.signOut === 'function') {
        return window.authService.signOut().then(function () {
          window.location.reload();
        }).catch(function () {
          window.location.reload();
        });
      }
      try {
        localStorage.removeItem('firebaseIdToken');
        localStorage.removeItem('firebaseUid');
        localStorage.removeItem('userAuthenticated');
        localStorage.removeItem('authenticatedUserName');
        localStorage.removeItem('authenticatedUsername');
      } catch (e) {}
      window.location.reload();
    }
  </script>

  <!-- Service worker: only flutter_bootstrap.js registers it (with ?v=...) — a second register here kept stale main.dart.js on many devices. -->

  <!-- Module load order fixed; ?v= cracks HTTP caches when you bump after deploy -->
  <script type="module" src="firebase-config.js?v=moremi-fb-fallback"></script>
  <script type="module" src="auth-service.js?v=moremi-fb-fallback"></script>
  <script type="module" src="auth-ui.js?v=moremi-fb-fallback"></script>
  <script type="module" src="auth-controller.js?v=moremi-fb-fallback"></script>
  <script src="app-update.js"></script>
  <script src="pwa-install.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" id="flutter-bootstrap-script"></script>
</body>
</html>
