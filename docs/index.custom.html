<!DOCTYPE html>
<html>
<head>
  <base href="/Moremi-PWA/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Moremi wildlife sightings">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moremi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <title>Moremi wildlife</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
    }

    /*
      Fill the viewport reliably on GitHub Pages PWA. Flex on body fights inline <script>
      siblings; fixed #flutter-root matches how Flutter expects a sized hostElement.
    */
    #flutter-root {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      z-index: 0;
      margin: 0;
      padding: 0;
    }

    /* Engine inserts these under the host */
    #flutter-root flutter-view,
    #flutter-root flt-scene-host,
    #flutter-root flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    flutter-view, flt-scene-host {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <script>
    function moremiSignOut() {
      if (window.authService && typeof window.authService.signOut === 'function') {
        return window.authService.signOut().then(function () {
          window.location.reload();
        }).catch(function () {
          window.location.reload();
        });
      }
      try {
        localStorage.removeItem('firebaseIdToken');
        localStorage.removeItem('firebaseUid');
        localStorage.removeItem('userAuthenticated');
        localStorage.removeItem('authenticatedUserName');
        localStorage.removeItem('authenticatedUsername');
      } catch (e) {}
      window.location.reload();
    }
  </script>

  <!-- Service worker: only flutter_bootstrap.js registers it (with ?v=...) — a second register here kept stale main.dart.js on many devices. -->

  <script type="module" src="firebase-config.js?v=moremi-viewport-fixed-202605b"></script>
  <script type="module" src="auth-service.js?v=moremi-viewport-fixed-202605b"></script>
  <script type="module" src="auth-ui.js?v=moremi-viewport-fixed-202605b"></script>
  <script type="module" src="auth-controller.js?v=moremi-viewport-fixed-202605b"></script>
  <script src="app-update.js"></script>
  <script src="pwa-install.js"></script>
</head>
<body>
  <script>
    (function () {
      try {
        if (typeof URLSearchParams === 'undefined') return;
        var p = new URLSearchParams(window.location.search);
        if (p.get('moremi_dev_sw_reset') === '1' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
      } catch (e) {}
    })();
  </script>
  <div id="flutter-root"></div>
  <script src="flutter_bootstrap.js" id="flutter-bootstrap-script"></script>
</body>
</html>
