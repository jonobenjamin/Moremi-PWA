<!DOCTYPE html>
<html>
<head>
  <base href="/Moremi-PWA/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Moremi wildlife sightings">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moremi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <title>Moremi wildlife</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100%;
    }

    html {
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #1a1a1a;
      -webkit-text-size-adjust: 100%;
    }

    /* Host must fill viewport; flex + min-height:0 fixes web layout collapse for embedded map */
    #flutter-root {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      position: relative;
      display: block;
    }

    flutter-view, flt-scene-host {
      width: 100%;
      height: 100%;
      display: block;
    }

    flutter-view {
      min-height: 100%;
    }
  </style>

  <script>
    function moremiSignOut() {
      if (window.authService && typeof window.authService.signOut === 'function') {
        return window.authService.signOut().then(function () {
          window.location.reload();
        }).catch(function () {
          window.location.reload();
        });
      }
      try {
        localStorage.removeItem('firebaseIdToken');
        localStorage.removeItem('firebaseUid');
        localStorage.removeItem('userAuthenticated');
        localStorage.removeItem('authenticatedUserName');
        localStorage.removeItem('authenticatedUsername');
      } catch (e) {}
      window.location.reload();
    }
  </script>

  <!-- Service worker: only flutter_bootstrap.js registers it (with ?v=...) — a second register here kept stale main.dart.js on many devices. -->

  <script type="module" src="firebase-config.js?v=moremi-map-fullbleed-202605"></script>
  <script type="module" src="auth-service.js?v=moremi-map-fullbleed-202605"></script>
  <script type="module" src="auth-ui.js?v=moremi-map-fullbleed-202605"></script>
  <script type="module" src="auth-controller.js?v=moremi-map-fullbleed-202605"></script>
  <script src="app-update.js"></script>
  <script src="pwa-install.js"></script>
</head>
<body>
  <script>
    (function () {
      try {
        if (typeof URLSearchParams === 'undefined') return;
        var p = new URLSearchParams(window.location.search);
        if (p.get('moremi_dev_sw_reset') === '1' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
      } catch (e) {}
    })();
  </script>
  <div id="flutter-root"></div>
  <script src="flutter_bootstrap.js" id="flutter-bootstrap-script"></script>
</body>
</html>
